spring:
  application:
    name: practice-transaction
  datasource:
    url: jdbc:postgresql://localhost:15432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug # 위 show-sql과 사실상 같은 역할이지만 로깅 레벨 기반이라 더 세밀하게 켜고 끌 수 있음
    org.hibernate.orm.jdbc.bind: trace # SQL의 ? 바인드 파라미터에 실제로 어떤 값이 들어가는지 보여줌 — 락/동시성 디버깅 때 "어느 트랜잭션이 어떤 값으로 쿼리를 날렸는지" 추적하는 데 필수